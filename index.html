<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bắt đầu để trở thành một nhà khoa học</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700;800&family=Lexend:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: 3 chặng màu — Chuẩn bị (xanh dương), Thực hiện (xanh lá), Công bố (cam). Mục lục trái nhóm theo chặng; mỗi trang bài mang màu chặng; trang giáo viên dùng bảng tổng hợp. */
:root{
  --bg:#F2F6FB; --paper:#FFFFFF; --fg:#14213A; --muted:#566178; --line:#D8E0EC;
  --blue:#1F5FD1; --blue-soft:#E4EDFC; --green:#12895A; --green-soft:#DDF3E9; --orange:#E2660F; --orange-soft:#FDEADB;
  --bad:#C7362A; --good:#12895A; --onacc:#FFFFFF;
  --ph:var(--blue); --ph-soft:var(--blue-soft);
  --display:"Be Vietnam Pro",system-ui,sans-serif; --body:"Lexend",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1424; --paper:#151F36; --fg:#E7EDF8; --muted:#9DABC4; --line:#28365A;
  --blue:#77A3FF; --blue-soft:#1B2B50; --green:#55D29E; --green-soft:#15352A; --orange:#FF9D52; --orange-soft:#3B2615;
  --bad:#FF7D6E; --good:#55D29E; --onacc:#0D1424; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1424; --paper:#151F36; --fg:#E7EDF8; --muted:#9DABC4; --line:#28365A;
  --blue:#77A3FF; --blue-soft:#1B2B50; --green:#55D29E; --green-soft:#15352A; --orange:#FF9D52; --orange-soft:#3B2615;
  --bad:#FF7D6E; --good:#55D29E; --onacc:#0D1424; color-scheme:dark}
.p0{--ph:var(--blue);--ph-soft:var(--blue-soft)}
.p1{--ph:var(--green);--ph-soft:var(--green-soft)}
.p2{--ph:var(--orange);--ph-soft:var(--orange-soft)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.7}
.shell{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;max-height:calc(100vh - 32px);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;margin:0 0 18px;font-family:var(--display);font-size:17px;font-weight:800;line-height:1.3;text-wrap:balance}
.logo{flex:none;width:34px;height:34px;border-radius:10px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;padding:6px;background:var(--paper);border:1px solid var(--line)}
.logo i{border-radius:3px}
.logo i:nth-child(1){background:var(--blue)} .logo i:nth-child(2){background:var(--green)} .logo i:nth-child(3){background:var(--orange)} .logo i:nth-child(4){background:var(--line)}
.toc{display:grid;gap:2px}
.toc .grp{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ph);margin:14px 0 4px 10px}
.toc a{display:grid;grid-template-columns:28px 1fr 18px;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;color:var(--fg);text-decoration:none;font-size:14.5px;line-height:1.35}
.toc a:hover{background:var(--paper)}
.toc a.on{background:var(--paper);box-shadow:0 0 0 1px var(--line)}
.toc .n{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:500;background:var(--ph-soft);color:var(--ph)}
.toc a.on .n{background:var(--ph);color:var(--onacc)}
.toc .tick{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line)}
.toc .tick.done{background:var(--good);border-color:var(--good)}
.user{margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);font-size:13.5px;display:grid;gap:4px}
.user b{font-size:14.5px}
.user .r{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted)}
.linkbtn{font:inherit;font-size:13px;background:none;border:0;color:var(--blue);cursor:pointer;padding:0;text-decoration:underline}
.sync{font-size:12.5px;color:var(--muted)} .sync.err{color:var(--bad)} .sync.ok{color:var(--good)}
.prog{margin-top:16px;font-size:13px;color:var(--muted)}
.prog .bar{height:8px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden;display:flex}
.prog .bar span{display:block;height:100%}
.mobnav{display:none}
main{min-width:0}
.page{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,44px);overflow:hidden}
.phase{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ph);background:var(--ph-soft);border-radius:999px;padding:4px 12px}
.phase b{font-family:var(--mono);font-weight:500}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.6vw,42px);line-height:1.18;letter-spacing:-.01em;margin:12px 0 10px;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.3;margin:36px 0 10px;text-wrap:balance}
h3{font-size:17px;margin:22px 0 6px}
p,li{max-width:68ch}
.lead{font-size:17.5px;color:var(--muted)}
mark{background:var(--orange-soft);color:inherit;padding:0 4px;border-radius:4px}
code{font-family:var(--mono);font-size:.88em;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.goal{background:var(--ph-soft);border-radius:14px;padding:16px 20px;margin:20px 0}
.goal b{display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ph);margin-bottom:4px}
.goal ul{margin:0;padding-left:18px}
.case{border:2px dashed var(--ph);border-radius:14px;padding:16px 20px;margin:24px 0;background:var(--paper)}
.case .lbl{display:inline-block;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ph)}
.case p{margin:6px 0 0}
.notice{border-radius:12px;padding:12px 16px;background:var(--orange-soft);font-size:14.5px;margin:0 0 18px}
.tbl{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14.5px;background:var(--paper)}
th,td{border-bottom:1px solid var(--line);padding:9px 14px;text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{background:var(--ph-soft);font-weight:600;color:var(--fg)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.cmp>div{min-width:0;border-radius:12px;padding:12px 16px;border:1.5px solid var(--line)}
.cmp .x{border-color:var(--bad)} .cmp .o{border-color:var(--good)}
.cmp .x b{color:var(--bad)} .cmp .o b{color:var(--good)}
.cmp p{margin:4px 0 0}
.lab{margin-top:38px}
.lab-h{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:19px;margin-bottom:10px}
.lab-h::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--ph)}
.tool{background:var(--bg);border-radius:14px;padding:20px;display:grid;gap:12px}
.tool p{margin:0}
label.f{display:grid;gap:4px;font-size:14px;font-weight:500}
input[type=text],input[type=number],input[type=password],textarea,select{font:inherit;font-size:15px;color:var(--fg);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--ph);outline:none}
textarea{min-height:76px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row>*{min-width:0}
.btn{font:600 14.5px var(--body);background:var(--blue);color:var(--onacc);border:0;border-radius:10px;padding:10px 18px;cursor:pointer;justify-self:start}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.btn.send{background:var(--orange)}
.btn.isdone{background:var(--green)}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.out{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.ok{color:var(--good);font-weight:600} .no{color:var(--bad);font-weight:600}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.chk input{margin-top:5px;accent-color:var(--green);width:17px;height:17px;flex:none}
.quiz{display:grid;gap:14px}
.q{background:var(--bg);border-radius:14px;padding:18px 20px}
.q p.qt{font-weight:600;margin:0 0 10px}
.q .ctx{display:block;font-weight:400;background:var(--paper);border-left:3px solid var(--ph);border-radius:6px;padding:6px 12px;margin-top:6px}
.opts{display:grid;gap:8px}
.opts button{font:inherit;font-size:15px;text-align:left;background:var(--paper);color:var(--fg);border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;display:flex;gap:10px}
.opts button:hover{border-color:var(--blue)}
.opts .lt{font-family:var(--mono);font-weight:500;color:var(--muted)}
.opts button.right{border-color:var(--good);background:var(--green-soft)}
.opts button.wrong{border-color:var(--bad)}
.expl{margin:10px 0 0;font-size:14.5px}
.score{margin:4px 0 0;font-size:14.5px;color:var(--muted)}
.finish{margin-top:32px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:20px}
.navbtn{font:600 14px var(--body);color:var(--blue);text-decoration:none}
.hero{margin:calc(-1 * clamp(20px,4vw,44px));margin-bottom:0;padding:clamp(24px,4.5vw,48px) clamp(20px,4vw,44px);background:var(--blue);color:var(--onacc);position:relative}
.hero .eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.hero h1{margin:10px 0 10px;color:var(--onacc)}
.hero p{margin:0;max-width:60ch;font-size:17px;opacity:.92}
.hero .stripe{position:absolute;left:0;right:0;bottom:0;height:8px;display:grid;grid-template-columns:3fr 3fr 2fr}
.hero .stripe i:nth-child(1){background:var(--blue);filter:brightness(1.25)} .hero .stripe i:nth-child(2){background:var(--green)} .hero .stripe i:nth-child(3){background:var(--orange)}
.phases{display:grid;grid-template-columns:3fr 3fr 2fr;gap:12px;margin:28px 0 8px}
.phases>div{min-width:0;border-radius:14px;padding:14px 16px;background:var(--ph-soft)}
.phases b{display:block;color:var(--ph);font-size:15px}
.phases span{font-size:13.5px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:18px 0}
.card{display:grid;align-content:start;gap:6px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:var(--fg);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--ph);transform:translateY(-2px)}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card .n{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:var(--mono);font-size:13px;background:var(--ph);color:var(--onacc)}
.card .st{font-size:12px;font-weight:600;color:var(--good)}
.card b{font-size:16px;line-height:1.35}
.card span.d{font-size:13.5px;color:var(--muted);line-height:1.5}
.flip{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.flip details{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.flip details[open]{border-color:var(--ph)}
.flip summary{cursor:pointer;font-weight:600;font-size:15px}
.flip p{font-size:14.5px;margin:8px 0 0}
.chart{overflow-x:auto}
.chart svg{display:block;max-width:100%}
/* đăng nhập & giáo viên */
.login{max-width:440px;margin:8px auto 0;display:grid;gap:14px}
.login .msg{min-height:1.5em;font-size:14.5px;color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.stat{background:var(--bg);border-radius:12px;padding:12px 16px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.filters label{flex:1;min-width:180px}
.tt table{min-width:780px}
.tt td{font-variant-numeric:tabular-nums}
.tt tr.hs{cursor:pointer}
.tt tr.hs:hover td{background:var(--bg)}
.tt tr.detail td{background:var(--bg)}
.strip{display:inline-grid;grid-template-columns:repeat(8,14px);gap:3px;vertical-align:middle}
.strip i{height:14px;border-radius:3px;background:var(--line)}
.strip i.on{background:var(--ph)}
.sp{display:grid;gap:8px}
.sp div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap;font-size:14px;overflow-wrap:anywhere}
.sp small{display:block;color:var(--muted);font-size:12.5px;margin-bottom:4px}
.muted{color:var(--muted)}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  aside{display:none}
  .mobnav{display:grid;gap:8px;margin-bottom:14px}
  .row,.cmp,.phases,.stats{grid-template-columns:1fr}
}
.topic{font-family:var(--display);font-weight:800;font-size:clamp(17px,2.4vw,21px);line-height:1.4;text-transform:uppercase;letter-spacing:.01em;color:var(--fg);max-width:none}
.deliv{margin:6px 0 0;padding-left:18px;columns:2;column-gap:28px}
.deliv li{break-inside:avoid}
.subh{font-family:var(--display);font-weight:700;font-size:16.5px;color:var(--ph)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.row3>*{min-width:0}
.qlist{display:grid;gap:10px}
.qcard{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;font-size:14.5px;display:grid;gap:6px;overflow-wrap:anywhere}
.qcard.warn{border-color:var(--orange)}
.opts2{display:flex;flex-wrap:wrap;gap:6px 18px}
.opts2 .ans{color:var(--good);font-weight:600}
.imgph{justify-self:start;font-size:13px;border:1.5px dashed var(--line);border-radius:8px;padding:4px 10px;color:var(--muted)}
.tag{display:inline-block;font-size:12.5px;border-radius:999px;padding:2px 10px;background:var(--orange-soft);margin:2px 6px 0 0}
.tag.ok-tag{background:var(--green-soft)}
.alertbar{border-radius:10px;padding:10px 14px;font-weight:600;background:var(--paper);border:1px solid var(--line)}
.alertbar.lv0{background:var(--green-soft);border-color:transparent}
.alertbar.lv1{background:var(--blue-soft);border-color:transparent}
.alertbar.lv2{background:var(--orange-soft);border-color:var(--orange)}
.alertbar.lv3{background:var(--bad);color:var(--onacc);border-color:transparent}
.exam{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px}
@media (max-width:860px){.deliv{columns:1}.row3{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="shell">
  <aside>
    <p class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Bắt đầu để trở thành một nhà khoa học</p>
    <nav class="toc" id="toc"></nav>
    <div id="user"></div>
    <div class="prog"><span id="progText">Đã hoàn thành 0/8 bài</span><div class="bar" id="progBar"></div></div>
  </aside>
  <main>
    <div class="mobnav">
      <label class="f" for="mobsel">Chọn trang
        <select id="mobsel"></select>
      </label>
      <div id="userm"></div>
    </div>
    <article class="page" id="page"></article>
  </main>
</div>

<script src="config.js"></script>
<script>
const API=String(window.NCKH_API||"").trim();
const ONLINE=/^https:\/\/script\.google\.com\/.+\/exec$/.test(API);
const CASE="Nghiên cứu giải pháp tự động trích xuất đề thi THPT từ tài liệu Word (có hình ảnh) tích hợp cơ chế phát hiện và cảnh báo vi phạm quy chế thi phục vụ hệ thống ôn thi trực tuyến";
const RQ=["RQ1. Giải pháp trích xuất đúng bao nhiêu phần trăm câu hỏi (gồm nội dung, phương án, đáp án và hình ảnh) từ các đề thi Word THPT?","RQ2. Cơ chế giám sát phát hiện đúng bao nhiêu phần trăm hành vi vi phạm (rời trang, sao chép, thoát toàn màn hình) và báo nhầm bao nhiêu lần?","RQ3. Giáo viên tiết kiệm được bao nhiêu thời gian khi đưa một đề lên hệ thống, so với nhập thủ công?"];
const L=[
{id:"bai-1",t:"Đặt câu hỏi nghiên cứu",d:"Hiểu đề tài và tách tên đề tài thành những câu hỏi trả lời được bằng dữ liệu",
goals:["Giải thích được đề tài giải quyết vấn đề gì, cho ai","Tách tên đề tài dài thành các phần và các câu hỏi nghiên cứu","Kiểm tra câu hỏi theo 5 tiêu chí của một câu hỏi tốt"],
body:`
<h2>Đề tài bắt đầu từ một vấn đề có thật</h2>
<p>Thầy cô thường soạn đề thi trên Word. Muốn đưa đề lên hệ thống ôn thi trực tuyến, thầy cô phải gõ lại hoặc sao chép từng câu, từng phương án, rồi tải từng hình vẽ lên. Việc này <mark>mất nhiều thời gian và dễ sai</mark>: hình gắn nhầm câu, mất công thức, chọn nhầm đáp án.</p>
<p>Khi học sinh làm bài ôn trực tuyến, các em có thể mở tab khác để tra cứu hoặc sao chép đề ra ngoài. Khi đó, điểm ôn tập không phản ánh đúng năng lực thật.</p>
<h3>Ba tầng: chủ đề → vấn đề → câu hỏi</h3>
<div class="tbl"><table>
<tr><th>Tầng</th><th>Trong đề tài này</th></tr>
<tr><td>Chủ đề</td><td>Công nghệ thông tin trong kiểm tra, đánh giá</td></tr>
<tr><td>Vấn đề</td><td>Đưa đề Word lên hệ thống ôn thi mất thời gian, dễ lỗi; học sinh dễ vi phạm quy chế khi làm bài trực tuyến</td></tr>
<tr><td>Câu hỏi</td><td>Một giải pháp tự động có trích xuất đề chính xác và phát hiện vi phạm đáng tin cậy không?</td></tr>
</table></div>
<h3>Tách tên đề tài thành từng phần</h3>
<p>Tên đề tài dài vì nó chứa nhiều ý. Mỗi ý là một việc em phải làm và phải đánh giá được.</p>
<div class="tbl"><table>
<tr><th>Phần trong tên đề tài</th><th>Nghĩa là hệ thống phải…</th></tr>
<tr><td>Tự động trích xuất đề thi THPT</td><td>Đọc file Word, tách đúng từng câu hỏi, các phương án và đáp án đúng</td></tr>
<tr><td>Từ tài liệu Word (có hình ảnh)</td><td>Giữ được hình vẽ, bảng, công thức và gắn đúng vào câu hỏi chứa chúng</td></tr>
<tr><td>Cơ chế phát hiện vi phạm quy chế thi</td><td>Nhận biết học sinh rời trang làm bài, sao chép, dán, thoát toàn màn hình</td></tr>
<tr><td>Cảnh báo</td><td>Nhắc nhở và cảnh báo theo mức, ghi nhật ký để giáo viên xem lại</td></tr>
<tr><td>Phục vụ hệ thống ôn thi trực tuyến</td><td>Người dùng là giáo viên và học sinh THPT; sản phẩm dùng được trong thực tế</td></tr>

<li><b>Chưa có đáp án sẵn.</b></li>

</ol>

goals:["Biết cần tìm tài liệu về những mảng nào cho đề tài","Đánh giá độ tin cậy của nguồn bằng bộ tiêu chí CRAAP","Lập bảng tổng quan để chỉ ra khoảng trống nghiên cứu"],
body:`

<tr><td>Công cụ đọc Word</td><td>Thư viện lập trình đọc được đoạn văn, định dạng (gạch chân, màu chữ) và hình ảnh</td><td>Tài liệu của python-docx, mammoth, Pandoc</td></tr>

<tr><td>Quy định</td><td>Cấu trúc, định dạng đề thi tốt nghiệp THPT; các mức xử lý vi phạm trong quy chế thi</td><td>Văn bản của Bộ Giáo dục và Đào tạo</td></tr>

<tr><td><code>online exam proctoring tab switching detection</code></td><td>Nghiên cứu về phát hiện rời trang khi thi trực tuyến</td></tr>
<tr><td><code>"academic integrity" online exam filetype:pdf</code></td><td>Bài báo về liêm chính trong thi trực tuyến</td></tr>
<tr><td><code>cấu trúc định dạng đề thi tốt nghiệp THPT site:moet.gov.vn</code></td><td>Văn bản chính thức về cấu trúc đề thi</td></tr>

<h3>Đánh giá nguồn bằng bộ tiêu chí CRAAP</h3>

<h3>Bảng tổng quan: tìm khoảng trống</h3>

</table></div>
<p>Dùng ý của người khác thì <b>phải ghi nguồn</b>. Không ghi nguồn là đạo văn.</p>`,

{id:"bai-3",t:"Giả thuyết và các biến",d:"Dự đoán kết quả có căn cứ, và biết điều gì thay đổi, điều gì được đo",
goals:["Viết giả thuyết đo được cho từng câu hỏi nghiên cứu","Xác định biến độc lập, biến phụ thuộc, biến kiểm soát của đề tài","Hiểu vai trò của phương án so sánh (nhập thủ công)"],
body:`
<h2>Giả thuyết là dự đoán có thể kiểm chứng</h2>
<p>Mỗi câu hỏi nghiên cứu cần một giả thuyết có <b>con số cụ thể</b>, để sau này em biết giả thuyết đúng hay sai.</p>
<p class="out"><b>Nếu</b> [em làm gì] <b>thì</b> [kết quả nào, đo bằng gì] <b>vì</b> [lý do dựa trên tài liệu].</p>
<div class="tbl"><table>
<tr><th>Câu hỏi</th><th>Giả thuyết</th></tr>
<tr><td>RQ1</td><td>Giải pháp trích xuất đúng ít nhất 95% số câu hỏi (gồm hình ảnh) trong bộ 30 đề Word soạn theo mẫu chuẩn.</td></tr>
<tr><td>RQ2</td><td>Cơ chế giám sát phát hiện ít nhất 90% số lần vi phạm theo kịch bản, và báo nhầm không quá 5%.</td></tr>
<tr><td>RQ3</td><td>Dùng giải pháp tự động giảm ít nhất 70% thời gian đưa một đề 40 câu lên hệ thống so với nhập thủ công.</td></tr>
</table></div>
<p>Giả thuyết có thể sai. Nếu kết quả chỉ đạt 85%, đó vẫn là một kết quả khoa học có giá trị; em phân tích vì sao.</p>
<h3>Ba loại biến trong đề tài</h3>
<div class="tbl"><table>
<tr><th>Biến</th><th>Là gì</th><th>Trong đề tài (RQ3)</th></tr>
<tr><td><b>Độc lập</b></td><td>Điều em chủ động thay đổi</td><td>Cách đưa đề lên hệ thống: nhập thủ công hay dùng giải pháp tự động</td></tr>
<tr><td><b>Phụ thuộc</b></td><td>Điều em đo</td><td>Thời gian đưa đề lên hệ thống; số câu bị sai</td></tr>
<tr><td><b>Kiểm soát</b></td><td>Điều giữ giống nhau</td><td>Cùng bộ đề, cùng người thực hiện, cùng máy tính, cùng trình duyệt</td></tr>
</table></div>
<h3>Phương án so sánh</h3>
<p>Muốn nói giải pháp "nhanh hơn", em phải nói <i>nhanh hơn cái gì</i>. Trong đề tài này, phương án so sánh (đối chứng) là <b>cách làm hiện tại: nhập đề thủ công</b>. Với RQ2, phương án so sánh là <b>những gì thực sự xảy ra</b>: em ghi lại học sinh đã làm hành động nào, rồi đối chiếu với điều hệ thống ghi nhận.</p>`,
caseText:`Sản phẩm của bước này: ba giả thuyết H1, H2, H3 tương ứng với ba câu hỏi nghiên cứu, kèm bảng biến của từng thử nghiệm.`,
tool:"vars",
quiz:[
{q:"Đo thời gian đưa đề lên hệ thống bằng cách nhập thủ công và bằng giải pháp tự động. Biến độc lập là gì?",o:["Thời gian đưa đề lên hệ thống","Cách đưa đề lên: thủ công hay tự động","Số câu trong đề","Loại máy tính"],a:1,e:"Cách đưa đề lên là điều em chủ động thay đổi. Thời gian là điều em đo (biến phụ thuộc)."},
{q:"Giả thuyết nào kiểm chứng được?",o:["Hệ thống sẽ hoạt động rất tốt","Giải pháp trích xuất đúng ít nhất 95% số câu hỏi trong bộ 30 đề kiểm thử","Học sinh sẽ không bao giờ gian lận","Hệ thống hiện đại nhất Việt Nam"],a:1,e:"Câu B có ngưỡng cụ thể (95%) và bộ dữ liệu cụ thể (30 đề), nên đo được và có thể sai."}
]},
{id:"bai-4",t:"Thiết kế phương pháp",d:"Thiết kế giải pháp, chuẩn bị dữ liệu kiểm thử và nghiên cứu có đạo đức",
goals:["Nắm các bước của phương pháp thiết kế, chế tạo và thử nghiệm","Chuẩn bị bộ dữ liệu kiểm thử có đáp án chuẩn","Biết nguyên tắc đạo đức khi giám sát học sinh"],
body:`
<h2>Phương pháp: thiết kế, chế tạo và thử nghiệm</h2>
<ol>
<li><b>Phân tích yêu cầu:</b> giáo viên cần gì, học sinh cần gì, đề thi có những dạng câu nào.</li>
<li><b>Thiết kế:</b> vẽ luồng xử lý và các thành phần của hệ thống.</li>
<li><b>Xây dựng nguyên mẫu:</b> làm phiên bản chạy được đầu tiên.</li>
<li><b>Thử nghiệm và đánh giá:</b> đo bằng số liệu theo ba câu hỏi nghiên cứu.</li>
</ol>
<h3>Luồng xử lý của giải pháp</h3>
<div class="tbl"><table>
<tr><th>Bước</th><th>Hệ thống làm gì</th></tr>
<tr><td>1. Đọc file</td><td>Giải nén file .docx, đọc nội dung XML và danh sách hình ảnh</td></tr>
<tr><td>2. Tách câu hỏi</td><td>Nhận biết "Câu 1.", "Câu 2."… và các phương án A, B, C, D</td></tr>
<tr><td>3. Xác định đáp án</td><td>Đọc định dạng đánh dấu đáp án đúng (ví dụ gạch chân hoặc tô màu)</td></tr>
<tr><td>4. Gắn hình ảnh</td><td>Gắn mỗi hình, công thức vào đúng câu chứa nó</td></tr>
<tr><td>5. Kiểm tra lỗi</td><td>Đánh dấu câu thiếu phương án, thiếu đáp án, nhắc đến hình nhưng không có hình</td></tr>
<tr><td>6. Lưu ngân hàng câu hỏi</td><td>Giáo viên duyệt lại các câu bị đánh dấu rồi lưu</td></tr>
<tr><td>7. Làm bài và giám sát</td><td>Ghi nhận rời trang, sao chép, dán, thoát toàn màn hình; cảnh báo theo mức; ghi nhật ký cho giáo viên</td></tr>
</table></div>
<h3>Bộ dữ liệu kiểm thử</h3>
<ul>
<li><b>Cho RQ1:</b> khoảng 30 đề Word của ít nhất 3 môn, có hình vẽ, bảng và công thức. Dùng đề công khai (đề minh họa, đề tham khảo) hoặc đề được thầy cô cho phép.</li>
<li><b>Dữ liệu chuẩn:</b> với mỗi đề, một người kiểm tra thủ công số câu, phương án, đáp án và hình ảnh. Đây là <mark>"đáp án" để chấm kết quả của hệ thống</mark>.</li>
<li><b>Cho RQ2:</b> khoảng 20 học sinh tình nguyện làm bài thử theo một kịch bản gồm hành động vi phạm và hành động bình thường.</li>
<li><b>Cho RQ3:</b> 3–5 giáo viên đưa cùng một đề lên hệ thống bằng hai cách, em bấm giờ.</li>
</ul>
<h3>Đạo đức nghiên cứu</h3>
<ul>
<li><b>Thông báo trước:</b> học sinh biết rõ hệ thống ghi nhận những hành vi nào.</li>
<li><b>Tự nguyện:</b> có phiếu đồng ý của học sinh và phụ huynh.</li>
<li><b>Thu thập tối thiểu:</b> chỉ lưu loại sự kiện và thời điểm. Không ghi hình, ghi âm nếu không thật sự cần.</li>
<li><b>Không xử lý oan:</b> cảnh báo của hệ thống chỉ là gợi ý; giáo viên xem nhật ký trước khi kết luận.</li>
<li><b>Bản quyền đề thi:</b> chỉ dùng đề được phép sử dụng.</li>
</ul>`,
caseText:`Sản phẩm của bước này: kế hoạch nghiên cứu một trang, gồm câu hỏi, giả thuyết, bộ dữ liệu kiểm thử, cách đo và cam kết đạo đức. Điền kế hoạch ở công cụ bên dưới rồi nộp cho thầy cô.`,
tool:"plan",

{id:"bai-5",t:"Thu thập dữ liệu",d:"Chạy thử giải pháp, ghi kết quả trung thực và có hệ thống",
goals:["Thử trích xuất một đề mẫu và ghi lại lỗi","Thử cơ chế giám sát và ghi nhật ký sự kiện","Lập bảng số liệu và nhật ký nghiên cứu"],
body:`
<h2>Hai bộ số liệu cần thu thập</h2>
<h3>1. Kết quả trích xuất (cho RQ1)</h3>
<div class="tbl"><table>
<tr><th>Mã đề</th><th>Môn</th><th>Số câu (chuẩn)</th><th>Số hình (chuẩn)</th><th>Câu trích đúng</th><th>Hình gắn đúng</th><th>Ghi chú lỗi</th></tr>
<tr><td>T01</td><td>Toán</td><td>22</td><td>6</td><td>21</td><td>6</td><td>Câu 15: công thức bị mất</td></tr>
<tr><td>L01</td><td>Vật lí</td><td>28</td><td>9</td><td>28</td><td>8</td><td>Hình câu 7 gắn sang câu 8</td></tr>
<tr><td>S01</td><td>Sinh học</td><td>28</td><td>4</td><td>28</td><td>4</td><td></td></tr>
</table></div>
<p>Phân loại mỗi lỗi vào một nhóm: <b>tách câu sai</b>, <b>thiếu phương án</b>, <b>sai đáp án</b>, <b>mất hình</b>, <b>gắn hình nhầm câu</b>, <b>lỗi công thức</b>. Ở bài 6, em sẽ vẽ biểu đồ theo các nhóm này.</p>
<h3>2. Nhật ký sự kiện giám sát (cho RQ2)</h3>
<div class="tbl"><table>
<tr><th>Thời điểm</th><th>Mã HS</th><th>Hành động thật (theo kịch bản)</th><th>Hệ thống ghi nhận</th><th>Kết luận</th></tr>
<tr><td>09:02:15</td><td>HS07</td><td>Chuyển sang tab khác</td><td>Rời trang · Nhắc nhở</td><td>Phát hiện đúng</td></tr>
<tr><td>09:04:40</td><td>HS07</td><td>Bấm vào thanh thông báo của máy</td><td>Mất tiêu điểm · Cảnh báo</td><td>Báo nhầm</td></tr>
<tr><td>09:06:02</td><td>HS07</td><td>Chụp màn hình bằng điện thoại</td><td>Không ghi nhận</td><td>Bỏ sót</td></tr>
</table></div>
<p>Cột "Kết luận" chỉ điền được vì em <mark>biết trước hành động thật</mark> theo kịch bản. Đây là lý do cần kịch bản thử nghiệm.</p>
<h3>Trung thực với số liệu</h3>
<ul>
<li>Không bỏ các đề hệ thống trích sai nhiều. Đó là dữ liệu quan trọng nhất để cải tiến.</li>
<li>Không sửa tay kết quả rồi ghi là "trích đúng".</li>
<li>Ghi rõ phiên bản giải pháp đã dùng cho mỗi lần chạy, vì em sẽ còn sửa code.</li>
<li>Ghi nhật ký nghiên cứu sau mỗi buổi làm và sao lưu số liệu ở hai nơi.</li>
</ul>`,

{id:"bai-6",t:"Phân tích dữ liệu",d:"Tính các chỉ số đánh giá và trả lời ba câu hỏi nghiên cứu",
goals:["Tính tỉ lệ trích xuất đúng và phân loại lỗi","Tính độ chính xác, độ nhạy và F1 của cơ chế phát hiện vi phạm","So sánh thời gian giữa hai cách đưa đề lên hệ thống"],
body:`
<h2>RQ1: Tỉ lệ trích xuất đúng</h2>
<p class="out">Tỉ lệ trích xuất đúng = Số câu trích đúng hoàn toàn ÷ Tổng số câu trong dữ liệu chuẩn</p>
<p>Một câu chỉ được tính là "đúng hoàn toàn" khi đúng cả nội dung, đủ 4 phương án, đúng đáp án và đủ hình. Ngoài tỉ lệ chung, hãy tính riêng cho <b>câu có hình</b> và <b>câu có công thức</b>, vì đây là phần khó nhất. Vẽ <b>biểu đồ cột</b> số lỗi theo từng nhóm lỗi.</p>
<h2>RQ2: Đánh giá cơ chế phát hiện vi phạm</h2>
<p>Đối chiếu nhật ký hệ thống với hành động thật, em có bốn loại kết quả:</p>
<div class="tbl"><table>
<tr><th></th><th>Hệ thống có cảnh báo</th><th>Hệ thống không cảnh báo</th></tr>
<tr><td><b>Có vi phạm thật</b></td><td>Phát hiện đúng (TP)</td><td>Bỏ sót (FN)</td></tr>
<tr><td><b>Không vi phạm</b></td><td>Báo nhầm (FP)</td><td>Bỏ qua đúng (TN)</td></tr>
</table></div>
<ul>
<li><b>Độ chính xác (Precision)</b> = TP ÷ (TP + FP): trong các lần cảnh báo, bao nhiêu phần trăm là đúng.</li>
<li><b>Độ nhạy (Recall)</b> = TP ÷ (TP + FN): trong các lần vi phạm thật, hệ thống bắt được bao nhiêu phần trăm.</li>
<li><b>F1</b> = 2 × Precision × Recall ÷ (Precision + Recall): một con số cân bằng cả hai.</li>
</ul>
<p>Với hệ thống cảnh báo học sinh, <mark>báo nhầm rất quan trọng</mark>: một lần báo nhầm có thể khiến một em bị nghi oan.</p>
<h2>RQ3: So sánh thời gian</h2>
<p>Tính trung bình, trung vị, độ lệch chuẩn thời gian của hai cách, rồi tính phần trăm thời gian giảm được. Trong Google Sheets: <code>=AVERAGE()</code>, <code>=MEDIAN()</code>, <code>=STDEV()</code>.</p>
<h3>Kết quả đúng đến đâu?</h3>
<p>Kết quả chỉ đúng trong phạm vi dữ liệu em đã thử. Nếu bộ đề chỉ gồm đề soạn theo mẫu chuẩn, em không được kết luận giải pháp chạy tốt với <i>mọi</i> file Word.</p>`,
caseText:`Sản phẩm của bước này: ba con số trả lời ba câu hỏi nghiên cứu (tỉ lệ trích đúng, Precision/Recall/F1, phần trăm thời gian giảm), kèm bảng và biểu đồ. Dùng công cụ bên dưới với số liệu mẫu, sau đó thay bằng số liệu của em.`,

{q:"Vì sao phải quan tâm đến số lần báo nhầm?",o:["Báo nhầm có thể khiến học sinh bị nghi oan","Báo nhầm làm hệ thống chạy nhanh hơn","Báo nhầm không ảnh hưởng gì","Báo nhầm giúp học sinh được điểm cao"],a:0,e:"Hệ thống cảnh báo vi phạm phải công bằng. Báo nhầm nhiều làm học sinh và giáo viên mất niềm tin vào hệ thống."}
]},
{id:"bai-7",t:"Viết báo cáo khoa học",d:"Trình bày đề tài theo cấu trúc chuẩn, rõ ràng và trung thực",
goals:["Nắm cấu trúc báo cáo của một đề tài thiết kế, chế tạo","Viết tóm tắt đề tài trong khoảng 250 từ","Trình bày hạn chế một cách thẳng thắn"],
body:`
<h2>Cấu trúc báo cáo</h2>
<div class="tbl"><table>
<tr><th>Phần</th><th>Trong đề tài này</th></tr>
<tr><td>Tóm tắt</td><td>Vấn đề, giải pháp, cách đánh giá, ba kết quả chính, ý nghĩa</td></tr>
<tr><td>Đặt vấn đề</td><td>Khó khăn khi đưa đề Word lên hệ thống; vi phạm khi ôn thi trực tuyến; ba câu hỏi nghiên cứu</td></tr>
<tr><td>Tổng quan</td><td>Cấu trúc file Word, các công cụ, các giải pháp giám sát đã có, khoảng trống</td></tr>
<tr><td>Phương pháp và thiết kế</td><td>Luồng xử lý, sơ đồ hệ thống, bộ dữ liệu kiểm thử, kịch bản thử nghiệm, cách đo</td></tr>
<tr><td>Kết quả</td><td>Tỉ lệ trích đúng, bảng lỗi, Precision/Recall/F1, so sánh thời gian (chỉ nêu số liệu)</td></tr>
<tr><td>Thảo luận</td><td>Vì sao có lỗi, so với giả thuyết, so với nghiên cứu khác, hạn chế</td></tr>
<tr><td>Kết luận</td><td>Trả lời ba câu hỏi, hướng phát triển, tài liệu tham khảo</td></tr>
</table></div>
<h3>Mẫu tóm tắt 5 câu</h3>
<ol>
<li><b>Vấn đề:</b> Giáo viên mất nhiều thời gian đưa đề thi từ Word lên hệ thống ôn thi trực tuyến, và học sinh dễ vi phạm quy chế khi làm bài trực tuyến.</li>
<li><b>Mục tiêu:</b> Đề tài xây dựng giải pháp tự động trích xuất đề thi có hình ảnh và cơ chế phát hiện, cảnh báo vi phạm.</li>
<li><b>Phương pháp:</b> Giải pháp được thử trên … đề Word với … câu hỏi, và với … học sinh tình nguyện theo kịch bản.</li>
<li><b>Kết quả:</b> Giải pháp trích xuất đúng …%; cơ chế giám sát đạt Precision …%, Recall …%; thời gian đưa đề giảm …%.</li>
<li><b>Ý nghĩa:</b> Kết quả gợi ý giải pháp có thể hỗ trợ giáo viên và tăng tính trung thực khi ôn thi trực tuyến.</li>
</ol>
<h3>Viết như nhà khoa học</h3>
<ul>
<li>Đưa vào báo cáo: sơ đồ luồng xử lý, ảnh chụp giao diện, bảng kết quả.</li>
<li>Dùng số liệu thay cho tính từ: "giảm 84% thời gian" thay cho "nhanh hơn rất nhiều".</li>
<li>Không phóng đại: viết "kết quả gợi ý" thay cho "đã chứng minh hoàn toàn".</li>
<li>Nêu hạn chế: chỉ thử với đề soạn theo mẫu; chưa phát hiện được thiết bị thứ hai như điện thoại.</li>
</ul>`,
caseText:`Sản phẩm của bước này: bản báo cáo hoàn chỉnh. Luyện nhận biết câu nào thuộc phần nào bằng bài tập bên dưới.`,

{q:"Câu dưới đây thuộc phần nào của báo cáo?",ctx:"Giải pháp trích xuất đúng 1.152 trên 1.200 câu hỏi (96%).",o:["Đặt vấn đề","Phương pháp","Kết quả","Thảo luận"],a:2,e:"Câu này nêu số liệu đo được và chưa giải thích, nên thuộc phần Kết quả."},
{q:"Câu nào thuộc phần Thảo luận?",o:["Bộ dữ liệu gồm 30 đề Word.","Phần lớn lỗi xảy ra ở câu có công thức MathType, vì công thức được lưu dưới dạng hình ảnh.","Báo cáo gồm 5 chương.","Hệ thống được viết bằng Python."],a:1,e:"Câu B giải thích nguyên nhân của kết quả. Giải thích và bình luận thuộc phần Thảo luận."}

{id:"bai-8",t:"Trình bày và bảo vệ",d:"Poster, thuyết trình kèm demo, và trả lời câu hỏi của hội đồng",
goals:["Thiết kế poster giới thiệu đề tài","Thuyết trình 5 phút có phần demo sản phẩm","Chuẩn bị trả lời các câu hỏi hội đồng hay hỏi về đề tài"],
body:`
<h2>Poster đề tài</h2>
<ul>
<li>Bố cục 3 cột: <b>Vấn đề và câu hỏi</b> → <b>Giải pháp</b> (sơ đồ luồng xử lý, ảnh giao diện) → <b>Kết quả và kết luận</b>.</li>
<li>Ba con số kết quả (tỉ lệ trích đúng, F1, phần trăm thời gian giảm) đặt to, nổi bật nhất.</li>
<li>Có một hình "trước và sau": file Word gốc và câu hỏi đã trích xuất trên hệ thống.</li>
<li>Mỗi đoạn chữ không quá 50 từ; tên đề tài đọc được từ xa 3 mét.</li>
</ul>
<h2>Thuyết trình 5 phút</h2>
<div class="tbl"><table>
<tr><th>Thời gian</th><th>Nội dung</th></tr>
<tr><td>0:00–0:40</td><td>Vấn đề: một con số về thời gian nhập đề, hoặc một tình huống học sinh mở tab tra cứu</td></tr>
<tr><td>0:40–1:20</td><td>Ba câu hỏi nghiên cứu và giả thuyết</td></tr>
<tr><td>1:20–2:20</td><td>Giải pháp: sơ đồ luồng xử lý</td></tr>
<tr><td>2:20–3:20</td><td>Demo: tải một đề Word lên, xem câu hỏi tách ra; thử rời trang để thấy cảnh báo</td></tr>
<tr><td>3:20–4:20</td><td>Kết quả: ba con số và một biểu đồ</td></tr>
<tr><td>4:20–5:00</td><td>Kết luận, hạn chế, hướng phát triển</td></tr>
</table></div>
<p>Luôn chuẩn bị <mark>video demo dự phòng</mark> phòng khi mạng hoặc máy tính gặp sự cố.</p>
<h3>Khi không biết câu trả lời</h3>
<p>Hãy thành thật: "Em chưa thử trường hợp này, đây là một hướng để em nghiên cứu tiếp." Hội đồng đánh giá cao sự trung thực hơn một câu trả lời đoán mò.</p>`,
caseText:`Sản phẩm của bước này: poster, bài thuyết trình 5 phút có demo, và câu trả lời đã chuẩn bị cho các câu hỏi bên dưới.`,
tool:"defense",
quiz:[
{q:"Trên poster đề tài, phần nào cần nổi bật nhất?",o:["Toàn bộ mã nguồn","Ba con số kết quả chính","Danh sách thư viện đã dùng","Lời cảm ơn"],a:1,e:"Người xem chỉ dừng lại vài giây. Ba con số kết quả cho họ biết ngay giải pháp tốt đến đâu."},
{q:"Hội đồng hỏi: hệ thống có phát hiện học sinh dùng điện thoại thứ hai không? Em trả lời thế nào?",o:["Có, hệ thống phát hiện được mọi hành vi","Chưa, vì trình duyệt không thấy thiết bị khác; đây là hạn chế và là hướng phát triển","Im lặng","Chuyển sang chủ đề khác"],a:1,e:"Trình duyệt chỉ biết những gì xảy ra trên chính máy đó. Thừa nhận hạn chế một cách rõ ràng là câu trả lời đúng."}
]}
];
const PH=[{k:"Chuẩn bị",r:"Bài 1–3",d:"Hiểu đề tài, đọc tài liệu, nêu giả thuyết"},{k:"Thực hiện",r:"Bài 4–6",d:"Thiết kế giải pháp, thử nghiệm và phân tích số liệu"},{k:"Công bố",r:"Bài 7–8",d:"Viết báo cáo, trình bày, bảo vệ"}];
const ph=i=>i<3?0:i<6?1:2;
const LOAI={"cau-hoi":"Câu hỏi nghiên cứu","gia-thuyet":"Giả thuyết","ke-hoach":"Kế hoạch nghiên cứu","nhat-ky":"Nhật ký nghiên cứu"};

/* ---------- trạng thái ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
let U=null;try{U=JSON.parse(ls.get("nckh-user")||"null")}catch(e){U=null}
let S;
const skey=()=>"nckh-v2-"+(U&&U.maHS?U.maHS:"khach");
function loadS(){S={done:{},quiz:{},score:{},sp:{},journal:"",queue:[]};try{Object.assign(S,JSON.parse(ls.get(skey())||"{}"))}catch(e){}}
const save=()=>ls.set(skey(),JSON.stringify(S));
const saveU=()=>ls.set("nckh-user",U?JSON.stringify(U):null);
loadS();
const fmt=d=>{const x=new Date(d);if(isNaN(x))return "";const p=n=>String(n).padStart(2,"0");return `${p(x.getDate())}/${p(x.getMonth()+1)} lúc ${p(x.getHours())}:${p(x.getMinutes())}`};

/* ---------- máy chủ ---------- */
async function api(p){
  let r;
  try{r=await fetch(API,{method:"POST",body:JSON.stringify(p)})}catch(e){throw new Error("Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.")}
  let j;try{j=await r.json()}catch(e){throw new Error("Máy chủ trả về dữ liệu không đọc được.")}
  if(!j.ok)throw new Error(j.loi||"Có lỗi xảy ra.");
  return j;
}
const isStudent=()=>ONLINE&&U&&!U.guest;
let busy=false;
function setSync(t,c){["sync","syncm"].forEach(id=>{const el=$(id);if(el){el.textContent=t;el.className="sync "+(c||"")}})}
function push(item){
  if(!isStudent())return;
  S.queue=S.queue.filter(q=>!(q.action===item.action&&q.bai===item.bai&&q.loai===item.loai));
  S.queue.push(item);save();flush();
}
async function flush(){
  if(busy||!isStudent()||!S.queue.length)return;
  busy=true;setSync("Đang lưu lên hệ thống…");
  try{
    while(S.queue.length){await api(Object.assign({},S.queue[0],{maHS:U.maHS,matKhau:U.matKhau}));S.queue.shift();save()}
    setSync("Đã lưu lên hệ thống","ok");
  }catch(e){setSync("Chưa lưu được: "+e.message+" Hệ thống sẽ thử lại khi em thao tác tiếp.","err")}
  busy=false;
}
const sendProgress=i=>push({action:"tienDo",bai:i+1,hoanThanh:!!S.done[L[i].id],diem:S.score[L[i].id]||""});
function nop(bai,loai,noiDung,msgId){
  const m=$(msgId);m.className="sync";
  if(!String(noiDung).trim()){m.textContent="Chưa có nội dung để nộp.";m.className="sync err";return}
  if(!ONLINE){m.textContent="Website chưa kết nối hệ thống quản lý nên chưa nộp được. Em hãy sao chép nội dung và gửi thầy cô.";m.className="sync err";return}
  if(!isStudent()){m.textContent="Em cần đăng nhập để nộp bài.";m.className="sync err";return}
  S.sp[bai+"-"+loai]={noiDung,luc:new Date().toISOString()};save();
  push({action:"sanPham",bai,loai,noiDung});
  m.textContent="Đã nộp ngày "+fmt(new Date());m.className="sync ok";
}
function nopStatus(bai,loai,msgId){const r=S.sp[bai+"-"+loai];if(r&&$(msgId)){$(msgId).textContent="Đã nộp ngày "+fmt(r.luc);$(msgId).className="sync ok"}}
function copyText(text,btn,fallbackEl){
  const done=()=>{btn.textContent="Đã sao chép"};
  const fb=()=>{if(fallbackEl){if(fallbackEl.select)fallbackEl.select();else{const r=document.createRange();r.selectNodeContents(fallbackEl);const s=getSelection();s.removeAllRanges();s.addRange(r)}}};
  try{navigator.clipboard.writeText(text).then(done,fb)}catch(e){fb()}
}

Câu 1. Hàm số y = x³ − 3x đạt cực đại tại điểm nào?

Câu 3. Trong không gian Oxyz, vectơ nào là vectơ chỉ phương của trục Ox?

Câu 5. Đồ thị hàm số nào có dạng như hình vẽ dưới đây?
A. y = x² − 2x
*B. y = −x² + 2x
C. y = x³ − 3x`;
function parseExam(text){
  const reQ=/^Câu\s+(\d+)\s*[.:)]\s*(.*)$/i,reO=/^(\*?)\s*([A-D])\s*[.)]\s*(.*)$/,reI=/\[\s*HÌNH\s*:\s*([^\]]+?)\s*\]/gi;
  const qs=[];let cur=null;
  text.replace(/\r/g,"").split("\n").forEach(raw=>{
    let line=raw.trim();if(!line)return;
    const imgs=[];line=line.replace(reI,(_,f)=>{imgs.push(f);return ""}).trim();
    const m=line.match(reQ);
    if(m){cur={so:+m[1],noiDung:m[2],pa:[],dapAn:[],hinh:[]};qs.push(cur)}
    if(cur)cur.hinh.push(...imgs);
    if(m||!cur||!line)return;
    if(reO.test(line)){
      line.split(/\s+(?=\*?\s*[A-D]\s*[.)]\s)/).forEach(part=>{const o=part.trim().match(reO);if(!o)return;
        cur.pa.push({k:o[2].toUpperCase(),t:o[3]});if(o[1])cur.dapAn.push(o[2].toUpperCase())});
      return;
    }
    if(cur.pa.length)cur.pa[cur.pa.length-1].t+=" "+line;else cur.noiDung+=" "+line;
  });
  qs.forEach((q,i)=>{const w=[];
    if(i&&q.so!==qs[i-1].so+1)w.push(`Số thứ tự không liên tục (sau câu ${qs[i-1].so} là câu ${q.so})`);
    if(q.pa.length!==4)w.push(`Có ${q.pa.length} phương án, cần đủ 4`);
    const keys=q.pa.map(p=>p.k);if(new Set(keys).size!==keys.length)w.push("Có phương án bị trùng chữ cái");
    if(!q.dapAn.length)w.push("Chưa xác định được đáp án đúng");
    if(q.dapAn.length>1)w.push("Có nhiều hơn một đáp án được đánh dấu");
    if(/(như\s+)?hình\s+(bên|vẽ|dưới)|như hình/i.test(q.noiDung)&&!q.hinh.length)w.push("Câu nhắc đến hình nhưng không tìm thấy hình ảnh");
    q.canhBao=w});
  return qs;
}

const MON={on:false,count:0,last:0,log:[],fs:false};
const LV=[["lv0","Đang làm bài. Hệ thống đang giám sát."],["lv1","Nhắc nhở: Em vừa rời khỏi bài thi. Hãy quay lại làm bài."],["lv2","Cảnh báo lần 2: Hành vi đã được ghi lại để giáo viên xem."],["lv3","Vi phạm lần 3: Bài làm bị dừng (mô phỏng). Giáo viên sẽ xem nhật ký trước khi quyết định."]];
function monEvent(type){
  if(!MON.on)return;
  const now=Date.now(),t=new Date(),p=n=>String(n).padStart(2,"0");
  const merged=now-MON.last<1500;
  if(!merged){MON.count++;MON.last=now}
  const lv=Math.min(MON.count,3);
  MON.log.push({luc:`${p(t.getHours())}:${p(t.getMinutes())}:${p(t.getSeconds())}`,type,merged,lv});
  if(lv>=3&&!merged){MON.on=false;try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}}
  renderMon();
}
function renderMon(){
  const bar=$("mBar"),tb=$("mLog");if(!bar||!tb)return;
  const lv=MON.on?Math.min(MON.count,3):(MON.count>=3?3:-1);
  if(lv<0){bar.className="alertbar";bar.textContent=MON.log.length?"Đã kết thúc bài làm thử.":"Chưa bắt đầu. Bấm \"Bắt đầu làm bài thử\".";}
  else{bar.className="alertbar "+LV[lv][0];bar.textContent=LV[lv][1]}
  $("mStart").hidden=MON.on;$("mStop").hidden=!MON.on;
  tb.innerHTML=`<tr><th>Thời điểm</th><th>Sự kiện trình duyệt ghi nhận</th><th>Xử lý</th></tr>`+(MON.log.length?MON.log.map(r=>`<tr><td>${r.luc}</td><td>${r.type}</td><td>${r.merged?"Gộp với sự kiện ngay trước, không tính thêm":"Lần "+Math.min(r.lv,3)+": "+["","Nhắc nhở","Cảnh báo","Dừng bài (mô phỏng)"][Math.min(r.lv,3)]}</td></tr>`).join(""):`<tr><td colspan="3" class="muted">Chưa có sự kiện nào.</td></tr>`);
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)monEvent("Trang bị ẩn: chuyển tab hoặc thu nhỏ cửa sổ")});
window.addEventListener("blur",()=>monEvent("Trang mất tiêu điểm: bấm sang cửa sổ hoặc ứng dụng khác"));
document.addEventListener("copy",()=>monEvent("Sao chép nội dung"));
document.addEventListener("paste",()=>monEvent("Dán nội dung"));
document.addEventListener("contextmenu",()=>monEvent("Mở menu chuột phải"));
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&MON.fs&&MON.on){MON.fs=false;monEvent("Thoát chế độ toàn màn hình")}else if(document.fullscreenElement)MON.fs=true});

    let t=`KẾ HOẠCH NGHIÊN CỨU\nĐề tài: ${CASE}\nCâu hỏi: ${v("pQ")}\nGiả thuyết: ${v("pH")}\nPhương pháp: ${v("pM")}\nCỡ mẫu: ${n||"?"}\nBiến độc lập: ${v("pIV")}\nBiến phụ thuộc: ${v("pDV")}\nThời gian: ${v("pT")}\nĐạo đức: ${$("pE").checked?"Đã có phiếu đồng ý":"CHƯA có phiếu đồng ý"}`;
    if(v("pM").startsWith("Thiết kế"))t+="\n→ Chuẩn bị dữ liệu chuẩn (kiểm tra thủ công từng đề) để chấm kết quả của hệ thống.";
    if(v("pM")==="Thực nghiệm có đối chứng"&&n)t+=`\n→ Chia ngẫu nhiên thành 2 nhóm, mỗi nhóm khoảng ${Math.floor(n/2)}.`;
    const w=[];if(n&&n<30)w.push("Cỡ mẫu dưới 30: hãy nêu rõ đây là hạn chế trong báo cáo.");if(!$("pE").checked)w.push("Cần có sự đồng ý của người tham gia trước khi thử nghiệm giám sát.");
    $("pOut").textContent=t+(w.length?"\n\nLưu ý:\n- "+w.join("\n- "):"")};
  ids.forEach(k=>{$(k).addEventListener("input",r);$(k).addEventListener("change",r)});r();
  $("pCopy").onclick=()=>copyText($("pOut").textContent,$("pCopy"),$("pOut"));
  $("pNop").onclick=()=>nop(4,"ke-hoach",$("pOut").textContent,"pMsg");nopStatus(4,"ke-hoach","pMsg");
}},
lab:{html:`<div class="subh">Thực hành 1. Thử trích xuất đề thi</div>
<p>Dán nội dung đề vào ô dưới. Trong file Word thật, đáp án đúng thường được đánh dấu bằng gạch chân hoặc tô màu. Ở bản thử này, em đánh dấu bằng dấu <code>*</code> trước phương án đúng, và ghi hình ảnh là <code>[HÌNH: tên file]</code>.</p>
<label class="f" for="exIn">Nội dung đề<textarea id="exIn" style="min-height:230px;font-family:var(--mono);font-size:13.5px"></textarea></label>
<div class="btns"><button class="btn" id="exBtn">Trích xuất</button><button class="btn ghost" id="exReset">Dùng lại đề mẫu</button></div>
<div class="out" id="exSum"></div>
<div class="qlist" id="exOut"></div>
<p class="muted" style="font-size:14px">Đề mẫu có 4 lỗi cố ý. Em tìm được bao nhiêu lỗi trước khi bấm Trích xuất? Mỗi câu bị đánh dấu là một câu giáo viên phải duyệt lại; đó chính là số liệu cho RQ1.</p>
<div class="subh" style="margin-top:14px">Thực hành 2. Thử cơ chế phát hiện vi phạm</div>
<p>Bấm "Bắt đầu làm bài thử", sau đó thử các hành động: chuyển sang tab khác, bấm ra ngoài cửa sổ, sao chép đề, bấm chuột phải. Hành động thứ ba sẽ dừng bài làm (mô phỏng). Hãy để ý: có lần nào hệ thống báo nhầm không?</p>
<div class="alertbar" id="mBar" role="status"></div>
<div class="exam" id="mExam"><b>Câu 1.</b> Hàm số y = x³ − 3x đạt cực đại tại điểm nào?<br>A. x = 1 &nbsp;&nbsp; B. x = −1 &nbsp;&nbsp; C. x = 0 &nbsp;&nbsp; D. x = 3</div>
<div class="btns"><button class="btn" id="mStart">Bắt đầu làm bài thử</button><button class="btn ghost" id="mStop" hidden>Kết thúc</button></div>
<div class="tbl"><table id="mLog"></table></div>
<p class="muted" style="font-size:14px">Các sự kiện xảy ra trong vòng 1,5 giây được gộp làm một, vì khi chuyển tab trình duyệt thường báo cùng lúc hai sự kiện. Đây là một quyết định thiết kế giúp giảm báo nhầm; em cần nêu nó trong phần Phương pháp.</p>
<div class="subh" style="margin-top:14px">Thực hành 3. Nhật ký nghiên cứu</div>
<p>Ghi lại sau mỗi buổi làm: đã thử gì, kết quả, lỗi gặp phải, ý tưởng sửa. Nội dung tự lưu trên máy này.</p>
<div class="btns"><button class="btn ghost" id="jAdd">Thêm dòng cho hôm nay</button></div>
<label class="f" for="jText">Nhật ký<textarea id="jText" style="min-height:180px;font-family:var(--mono);font-size:14px"></textarea></label>
<div class="btns"><button class="btn send" id="jNop">Nộp nhật ký cho giáo viên</button><button class="btn ghost" id="jCopy">Sao chép</button><span class="sync" id="jMsg"></span></div>`,
init(){
  const ex=$("exIn");ex.value=S.exam||SAMPLE_EXAM;
  ex.addEventListener("input",()=>{S.exam=ex.value;save()});
  const run=()=>{const qs=parseExam(ex.value),bad=qs.filter(q=>q.canhBao.length),nh=qs.reduce((a,q)=>a+q.hinh.length,0);
    $("exSum").innerHTML=qs.length?`Tách được <b>${qs.length}</b> câu hỏi, <b>${nh}</b> hình ảnh. <span class="ok">${qs.length-bad.length} câu hợp lệ</span>, <span class="no">${bad.length} câu cần giáo viên kiểm tra</span>. Tỉ lệ câu hợp lệ: <b>${Math.round((qs.length-bad.length)/qs.length*100)}%</b>.`:'<span class="no">Không tìm thấy câu hỏi nào. Mỗi câu cần bắt đầu bằng "Câu 1.", "Câu 2."…</span>';
    $("exOut").innerHTML=qs.map(q=>`<div class="qcard${q.canhBao.length?" warn":""}"><b>Câu ${q.so}.</b> ${esc(q.noiDung)}
      ${q.hinh.map(h=>`<div class="imgph">🖼 ${esc(h)}</div>`).join("")}
      <div class="opts2">${q.pa.map(p=>`<span class="${q.dapAn.includes(p.k)?"ans":""}">${p.k}. ${esc(p.t)}${q.dapAn.includes(p.k)?" ✓":""}</span>`).join("")}</div>
      ${q.canhBao.length?`<div>${q.canhBao.map(w=>`<span class="tag">⚠ ${esc(w)}</span>`).join("")}</div>`:'<div><span class="tag ok-tag">Hợp lệ</span></div>'}</div>`).join("")};
  $("exBtn").onclick=run;$("exReset").onclick=()=>{ex.value=SAMPLE_EXAM;S.exam="";save();run()};run();
  $("mStart").onclick=()=>{MON.on=true;MON.count=0;MON.last=0;MON.log=[];MON.fs=false;
    try{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(p&&p.then)p.then(()=>{MON.fs=true},()=>{})}catch(e){}
    renderMon()};
  $("mStop").onclick=()=>{MON.on=false;try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}renderMon()};
  renderMon();
  const ta=$("jText");ta.value=S.journal||"28/10 - Chạy thử trích xuất 5 đề Toán: 108/110 câu đúng. Lỗi: 2 câu có công thức MathType bị mất.\n";
  ta.addEventListener("input",()=>{S.journal=ta.value;save()});
  $("jAdd").onclick=()=>{const d=new Date();ta.value+=`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")} - Đã thử: … | Kết quả: … | Lỗi: … | Ý tưởng sửa: …\n`;S.journal=ta.value;save();ta.focus()};
  $("jCopy").onclick=()=>copyText(ta.value,$("jCopy"),ta);
  $("jNop").onclick=()=>nop(5,"nhat-ky",ta.value,"jMsg");nopStatus(5,"nhat-ky","jMsg");
}},
stats:{html:`<div class="subh">Phần 1. Đánh giá cơ chế phát hiện vi phạm (RQ2)</div>
<p>Nhập số lần của từng loại kết quả sau khi đối chiếu nhật ký hệ thống với kịch bản thử nghiệm.</p>
<div class="row3"><label class="f" for="cTP">Phát hiện đúng (TP)<input type="number" id="cTP" min="0" value="46"></label>
<label class="f" for="cFP">Báo nhầm (FP)<input type="number" id="cFP" min="0" value="3"></label>
<label class="f" for="cFN">Bỏ sót (FN)<input type="number" id="cFN" min="0" value="4"></label></div>
<div class="out" id="cOut"></div>
<div class="subh" style="margin-top:14px">Phần 2. So sánh thời gian đưa một đề 40 câu lên hệ thống (RQ3)</div>
<p>Nhập số phút của từng lần đo, mỗi số cách nhau bằng dấu cách hoặc xuống dòng. Thời gian tự động đã gồm cả thời gian giáo viên duyệt lại.</p>
<div class="row"><label class="f" for="sA">Nhập thủ công (phút)<textarea id="sA">52 61 48 70 55 66 58 49 63 57</textarea></label>
<label class="f" for="sB">Dùng giải pháp tự động (phút)<textarea id="sB">9 7 12 8 10 6 11 9 8 10</textarea></label></div>
<button class="btn" id="sBtn">Tính toán</button>
<div class="tbl"><table id="sTbl"></table></div><div class="chart" id="sChart"></div><div class="out" id="sOut"></div>
<p class="muted" style="font-size:14px">Các số điền sẵn là số liệu mẫu để em làm quen với công cụ, không phải kết quả thật của đề tài.</p>`,
init(){
  const pct=x=>(x*100).toLocaleString("vi-VN",{maximumFractionDigits:1})+"%";
  const prf=()=>{const g=k=>Math.max(0,Number($(k).value)||0),tp=g("cTP"),fp=g("cFP"),fn=g("cFN");
    const P=tp+fp?tp/(tp+fp):0,R=tp+fn?tp/(tp+fn):0,F=P+R?2*P*R/(P+R):0;
    $("cOut").innerHTML=`<b>Precision</b> = ${tp} ÷ (${tp} + ${fp}) = <b>${pct(P)}</b>: trong các lần cảnh báo, ${pct(P)} là đúng.<br><b>Recall</b> = ${tp} ÷ (${tp} + ${fn}) = <b>${pct(R)}</b>: hệ thống bắt được ${pct(R)} số lần vi phạm thật.<br><b>F1</b> = <b>${pct(F)}</b><br>`+
      (tp+fp+fn?`So với giả thuyết H2 (phát hiện ≥ 90%, báo nhầm ≤ 5%): Recall ${R>=0.9?'<span class="ok">đạt</span>':'<span class="no">chưa đạt</span>'}; tỉ lệ báo nhầm ${pct(1-P)} ${1-P<=0.05?'<span class="ok">đạt</span>':'<span class="no">chưa đạt</span>'}.`:"")};
  ["cTP","cFP","cFN"].forEach(k=>$(k).addEventListener("input",prf));prf();
  const parse=s=>s.split(/[\s;]+/).filter(Boolean).map(x=>Number(x.replace(",","."))).filter(x=>!isNaN(x));
  const st=a=>{const n=a.length;if(!n)return null;const m=a.reduce((x,y)=>x+y,0)/n,s=[...a].sort((x,y)=>x-y),med=n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2,sd=n>1?Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(n-1)):0;return{n,m,med,sd,min:s[0],max:s[n-1]}};
  const f=x=>x.toLocaleString("vi-VN",{maximumFractionDigits:1});
  const run=()=>{const A=st(parse($("sA").value)),B=st(parse($("sB").value));
    if(!A||!B){$("sOut").textContent="Mỗi cách cần ít nhất một số đo.";return}
    $("sTbl").innerHTML=`<tr><th></th><th>n</th><th>Trung bình</th><th>Trung vị</th><th>Độ lệch chuẩn</th><th>Nhỏ nhất – Lớn nhất</th></tr>`+[["Thủ công",A],["Tự động",B]].map(([k,s])=>`<tr><td>${k}</td><td>${s.n}</td><td>${f(s.m)}</td><td>${f(s.med)}</td><td>${f(s.sd)}</td><td>${f(s.min)} – ${f(s.max)}</td></tr>`).join("");
    const top=Math.max(A.m+A.sd,B.m+B.sd,1)*1.15,W=420,H=230,pl=44,pb=34,pt=14,ch=H-pb-pt,y=v=>pt+ch-(v/top)*ch;
    let svg=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Biểu đồ thời gian trung bình của hai cách">`;
    [0,.25,.5,.75,1].map(k=>top*k).forEach(t=>{svg+=`<line x1="${pl}" x2="${W-10}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(t)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${Math.round(t)}</text>`});
    svg+=`<text x="12" y="${pt+ch/2}" font-size="11" fill="var(--muted)" transform="rotate(-90 12 ${pt+ch/2})" text-anchor="middle">phút</text>`;
    [["Thủ công",A,"var(--orange)"],["Tự động",B,"var(--blue)"]].forEach(([k,s,c],i)=>{const x=pl+50+i*170,bw=90,cx=x+bw/2,hi=y(s.m+s.sd),lo=y(Math.max(0,s.m-s.sd));
      svg+=`<rect x="${x}" y="${y(s.m)}" width="${bw}" height="${pt+ch-y(s.m)}" fill="${c}" rx="3"/><line x1="${cx}" x2="${cx}" y1="${hi}" y2="${lo}" stroke="var(--fg)" stroke-width="1.5"/><line x1="${cx-8}" x2="${cx+8}" y1="${hi}" y2="${hi}" stroke="var(--fg)" stroke-width="1.5"/><line x1="${cx-8}" x2="${cx+8}" y1="${lo}" y2="${lo}" stroke="var(--fg)" stroke-width="1.5"/><text x="${cx}" y="${H-12}" font-size="13" text-anchor="middle" fill="var(--fg)">${k} (n=${s.n})</text>`});
    $("sChart").innerHTML=svg+"</svg>";
    const red=A.m?(A.m-B.m)/A.m:0;
    $("sOut").innerHTML=`Thời gian trung bình giảm <b>${f(A.m-B.m)} phút</b>, tức giảm <b>${pct(red)}</b> so với nhập thủ công. Thanh dọc trên mỗi cột là ±1 độ lệch chuẩn.<br>So với giả thuyết H3 (giảm ≥ 70%): ${red>=0.7?'<span class="ok">đạt</span>':'<span class="no">chưa đạt</span>'}.`+(A.n<30||B.n<30?"<br>Lưu ý: số lần đo còn ít, hãy nêu đây là hạn chế.":"")};
  $("sBtn").onclick=run;run();
}},
imrad:{html:`<p>Mỗi câu dưới đây lấy từ báo cáo của đề tài. Chọn phần của báo cáo mà câu đó thuộc về.</p>
${[["Giáo viên thường mất nhiều thời gian để đưa đề thi từ file Word lên hệ thống ôn thi trực tuyến.","I"],["Bộ dữ liệu kiểm thử gồm 30 đề Word của 3 môn, có hình ảnh và công thức.","M"],["Giải pháp trích xuất đúng 1.152 trên 1.200 câu hỏi (96%).","R"],["Phần lớn lỗi xảy ra ở câu có công thức MathType, vì công thức được lưu dưới dạng hình ảnh.","D"],["20 học sinh tình nguyện làm bài thử theo kịch bản gồm 10 hành động.","M"],["Đề tài đặt câu hỏi: giải pháp tự động trích xuất đúng bao nhiêu phần trăm câu hỏi?","I"],["Cơ chế giám sát đạt Precision 93,9% và Recall 92%.","R"],["Hệ thống chưa phát hiện được việc dùng điện thoại thứ hai; đây là hạn chế của giải pháp chạy trên trình duyệt.","D"]].map((x,i)=>`<label class="f" for="im${i}">${x[0]}<select id="im${i}" data-a="${x[1]}"><option value="">Chọn phần</option><option value="I">Đặt vấn đề</option><option value="M">Phương pháp</option><option value="R">Kết quả</option><option value="D">Thảo luận</option></select></label>`).join("")}
<button class="btn" id="imBtn">Kiểm tra</button><div class="out" id="imOut" hidden></div>`,
init(){$("imBtn").onclick=()=>{let ok=0;const sel=[...document.querySelectorAll("select[data-a]")];sel.forEach(s=>{const r=s.value===s.dataset.a;if(r)ok++;s.style.borderColor=s.value?(r?"var(--good)":"var(--bad)"):""});
  const o=$("imOut");o.hidden=false;o.innerHTML=ok===sel.length?`<span class="ok">Đúng cả ${sel.length}.</span> Em đã nắm cấu trúc báo cáo.`:`Đúng ${ok}/${sel.length}. Mẹo: phần Kết quả chỉ nêu số liệu; phần Thảo luận giải thích nguyên nhân và nêu hạn chế.`}}},
defense:{html:`<p>Đây là những câu hội đồng hay hỏi với đề tài này. Tự trả lời trước, sau đó bấm vào từng câu để xem gợi ý.</p>
<div class="flip">
${[["Đề tài của em khác gì các phần mềm nhập đề, trộn đề đã có?","Dựa vào bảng tổng quan ở bài 2: giữ được hình ảnh, hiểu định dạng đề THPT, và tích hợp cảnh báo vi phạm trong cùng một hệ thống."],["Nếu file Word không soạn theo mẫu chuẩn thì sao?","Nêu tỉ lệ trích đúng riêng với nhóm đề không chuẩn, và cơ chế đánh dấu câu cần giáo viên duyệt lại."],["Hệ thống báo nhầm thì học sinh có bị xử lý oan không?","Nêu tỉ lệ báo nhầm đo được, cách cảnh báo theo mức, và nguyên tắc giáo viên xem nhật ký trước khi kết luận."],["Hệ thống có phát hiện được điện thoại thứ hai không?","Thừa nhận đây là hạn chế: trình duyệt chỉ biết những gì xảy ra trên chính máy đó. Nêu hướng phát triển."],["Em bảo vệ dữ liệu của học sinh như thế nào?","Chỉ lưu loại sự kiện và thời điểm, có phiếu đồng ý, dùng mã số thay tên khi báo cáo."],["Công thức toán và hình ảnh được xử lý ra sao?","Mô tả cách hệ thống tìm hình trong file Word và gắn vào câu; nêu kết quả riêng cho nhóm câu có hình, có công thức."]].map(x=>`<details><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join("")}
</div>
<p style="margin-top:8px"><b>Kiểm tra poster và bài thuyết trình</b></p>
${["Tên đề tài đọc được từ xa 3 mét","Ba con số kết quả nổi bật nhất","Có sơ đồ luồng xử lý và ảnh giao diện","Có hình \"trước và sau\": file Word gốc và câu hỏi đã trích xuất","Mỗi biểu đồ có tên, tên trục và số mẫu n","Có nêu hạn chế và hướng phát triển","Đã chuẩn bị video demo dự phòng","Đã tập thuyết trình đúng 5 phút"].map((c,i)=>`<label class="chk"><input type="checkbox" id="ps${i}"><span>${c}</span></label>`).join("")}`,
init(){}}
};

/* ---------- trang ---------- */
function home(){
  const nDone=L.filter(l=>S.done[l.id]).length;
  return `<div class="hero"><div class="eyebrow">${isStudent()?"Chào "+esc(U.hoTen)+" · Lớp "+esc(U.lop):"Dành cho học sinh THPT"}</div>
<h1>Bắt đầu để trở thành một nhà khoa học</h1>
<p>Tám bài học dẫn em thực hiện trọn vẹn một đề tài nghiên cứu khoa học về hệ thống phần mềm: từ đặt câu hỏi, đọc tài liệu, thiết kế và thử nghiệm, đến viết báo cáo và bảo vệ trước hội đồng.</p>
<div class="stripe" aria-hidden="true"><i></i><i></i><i></i></div></div>
<div class="case p2" style="margin-top:28px"><div class="lbl">Đề tài nghiên cứu</div><p class="topic">${CASE}</p>
<p>Sau 8 bài, em sẽ có đủ sản phẩm của một đề tài hoàn chỉnh:</p>
<ul class="deliv"><li>Ba câu hỏi nghiên cứu và giả thuyết</li><li>Bảng tổng quan tài liệu, chỉ ra khoảng trống</li><li>Kế hoạch nghiên cứu và bộ dữ liệu kiểm thử</li><li>Số liệu trích xuất đề và nhật ký giám sát</li><li>Kết quả phân tích: tỉ lệ trích đúng, Precision, Recall, thời gian tiết kiệm</li><li>Báo cáo, poster và bài thuyết trình có demo</li></ul></div>
<div class="phases">${PH.map((p,i)=>`<div class="p${i}"><b>${p.k} · ${p.r}</b><span>${p.d}</span></div>`).join("")}</div>
<h2>${nDone?`Em đã hoàn thành ${nDone}/8 bài`:"Bắt đầu từ bài 1"}</h2>
<div class="cards">${L.map((l,i)=>`<a class="card p${ph(i)}" href="#${l.id}"><span class="top"><span class="n">${i+1}</span>${S.done[l.id]?'<span class="st">Đã xong ✓</span>':""}</span><b>${l.t}</b><span class="d">${l.d}</span></a>`).join("")}</div>
<h2>Cách học hiệu quả</h2>
<ul><li>Học theo thứ tự, vì mỗi bước dựa vào kết quả của bước trước.</li><li>Cuối mỗi bài, khung "Áp dụng vào đề tài" cho biết sản phẩm em cần làm ra ở bước đó.</li><li>Ở bài 1, 3, 4 và 5, bấm nút màu cam để nộp sản phẩm cho giáo viên.</li><li>${isStudent()?"Tiến độ, điểm kiểm tra và bài nộp được lưu lên hệ thống của giáo viên.":"Tiến độ đang được lưu trên trình duyệt của máy này."}</li></ul>`;
}
function lesson(i){
  const l=L[i];
  return `<span class="phase">Chặng ${PH[ph(i)].k} · <b>Bài ${i+1}/8</b></span><h1>${l.t}</h1><p class="lead">${l.d}</p>
<div class="goal"><b>Sau bài này em sẽ</b><ul>${l.goals.map(g=>`<li>${g}</li>`).join("")}</ul></div>
${l.body}
<div class="case"><div class="lbl">Áp dụng vào đề tài · bước ${i+1}</div><p>${l.caseText}</p></div>
<section class="lab"><div class="lab-h">Thực hành</div><div class="tool">${TOOLS[l.tool].html}</div></section>
<section class="lab"><div class="lab-h">Kiểm tra nhanh</div><div class="quiz">${l.quiz.map((q,qi)=>`<div class="q" data-qi="${qi}"><p class="qt">Câu ${qi+1}. ${q.q}${q.ctx?`<span class="ctx">${q.ctx}</span>`:""}</p><div class="opts">${q.o.map((o,oi)=>`<button data-i="${oi}"><span class="lt">${"ABCD"[oi]}</span><span>${o}</span></button>`).join("")}</div><p class="expl" hidden></p></div>`).join("")}<p class="score" id="score"></p></div></section>
<div class="finish"><a class="navbtn" href="#${i?L[i-1].id:"trang-chu"}">← ${i?"Bài "+i:"Trang chủ"}</a>
<button class="btn${S.done[l.id]?" isdone":""}" id="doneBtn">${S.done[l.id]?"Đã hoàn thành ✓":"Đánh dấu hoàn thành"}</button>
<a class="navbtn" href="#${i<7?L[i+1].id:"trang-chu"}">${i<7?"Bài "+(i+2):"Trang chủ"} →</a></div>`;
}
function initLesson(i){
  const l=L[i];TOOLS[l.tool].init();
  const paint=(qel,q,c)=>{qel.querySelectorAll(".opts button").forEach(x=>{x.classList.remove("right","wrong");if(+x.dataset.i===q.a)x.classList.add("right")});
    if(c!==q.a)qel.querySelector(`[data-i="${c}"]`).classList.add("wrong");
    const ex=qel.querySelector(".expl");ex.hidden=false;ex.innerHTML=(c===q.a?'<span class="ok">Đúng.</span> ':'<span class="no">Chưa đúng.</span> ')+q.e};
  const showScore=()=>{$("score").textContent=S.score[l.id]?`Điểm (tính theo lựa chọn đầu tiên): ${S.score[l.id]} câu đúng.`:"Điểm được tính theo lựa chọn đầu tiên của mỗi câu."};
  const saved=S.quiz[l.id]||{};
  document.querySelectorAll(".q").forEach(qel=>{const qi=+qel.dataset.qi,q=l.quiz[qi];
    if(saved[qi]!==undefined)paint(qel,q,saved[qi]);
    qel.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{const c=+b.dataset.i;paint(qel,q,c);
      S.quiz[l.id]=S.quiz[l.id]||{};
      if(S.quiz[l.id][qi]===undefined){S.quiz[l.id][qi]=c;
        if(Object.keys(S.quiz[l.id]).length===l.quiz.length&&!S.score[l.id]){S.score[l.id]=l.quiz.filter((qq,k)=>S.quiz[l.id][k]===qq.a).length+"/"+l.quiz.length;sendProgress(i)}
        save();showScore()}
    })});
  showScore();
  $("doneBtn").onclick=()=>{S.done[l.id]=!S.done[l.id];save();sendProgress(i);
    $("doneBtn").textContent=S.done[l.id]?"Đã hoàn thành ✓":"Đánh dấu hoàn thành";$("doneBtn").classList.toggle("isdone",!!S.done[l.id]);nav(i)};
}

/* ---------- đăng nhập học sinh ---------- */
function loginHTML(){
  return `<span class="phase">Đăng nhập</span><h1>Bắt đầu để trở thành một nhà khoa học</h1>
<p class="lead">Đăng nhập để lưu tiến độ học và nộp bài cho giáo viên. Mã học sinh và mật khẩu do thầy cô cung cấp.</p>
<form class="login" id="lgForm">
<label class="f" for="lgMa">Mã học sinh<input type="text" id="lgMa" autocomplete="username" placeholder="Ví dụ: HS001"></label>
<label class="f" for="lgMk">Mật khẩu<input type="password" id="lgMk" autocomplete="current-password"></label>
<button class="btn" id="lgBtn" type="submit">Đăng nhập</button>
<p class="msg" id="lgMsg" role="alert"></p>
<p class="muted" style="font-size:14px;margin:0">Chưa có tài khoản? Em vẫn có thể <button type="button" class="linkbtn" id="lgGuest">học không cần đăng nhập</button>; khi đó tiến độ chỉ lưu trên máy này và không nộp bài được.</p>
</form>`;
}
function initLogin(){
  $("lgGuest").onclick=()=>{U={guest:true,maHS:"khach",hoTen:"Khách"};saveU();loadS();route()};
  $("lgForm").onsubmit=async e=>{e.preventDefault();
    const ma=$("lgMa").value.trim(),mk=$("lgMk").value.trim(),o=$("lgMsg");
    if(!ma||!mk){o.textContent="Em hãy nhập đủ mã học sinh và mật khẩu.";return}
    $("lgBtn").disabled=true;o.style.color="var(--muted)";o.textContent="Đang kiểm tra…";
    try{
      const j=await api({action:"dangNhap",maHS:ma,matKhau:mk});
      U={maHS:String(j.hs.maHS),hoTen:j.hs.hoTen,lop:j.hs.lop,matKhau:mk};saveU();loadS();
      (j.tienDo||[]).forEach(r=>{const l=L[Number(r.bai)-1];if(!l)return;S.done[l.id]=S.done[l.id]||r.hoanThanh==="Có";if(r.diemKiemTra&&!S.score[l.id])S.score[l.id]=String(r.diemKiemTra)});
      (j.sanPham||[]).forEach(r=>{const k=r.bai+"-"+r.loai;if(!S.sp[k])S.sp[k]={noiDung:r.noiDung,luc:r.capNhat};if(r.loai==="nhat-ky"&&!S.journal)S.journal=String(r.noiDung)});
      save();location.hash="trang-chu";route();
    }catch(err){o.style.color="";o.textContent=err.message;$("lgBtn").disabled=false}
  };
}
function logout(){U=null;saveU();loadS();location.hash="trang-chu";route()}

/* ---------- trang giáo viên ---------- */
let GV=null,gvKey="";try{gvKey=sessionStorage.getItem("nckh-gv")||""}catch(e){}
const SAMPLE={hocSinh:[{maHS:"HS001",hoTen:"Học sinh mẫu 1",lop:"10A1"},{maHS:"HS002",hoTen:"Học sinh mẫu 2",lop:"10A1"},{maHS:"HS003",hoTen:"Học sinh mẫu 3",lop:"10A2"},{maHS:"HS004",hoTen:"Học sinh mẫu 4",lop:"10A2"}],
tienDo:[[1,1,"2/2"],[1,2,"2/2"],[1,3,"1/2"],[1,4,"2/2"],[1,5,""],[2,1,"1/2"],[2,2,"2/2"],[3,1,"2/2"],[3,2,"2/2"],[3,3,"2/2"],[3,4,"2/2"],[3,5,"2/2"],[3,6,"1/2"],[3,7,"2/2"]].map(([h,b,d],k)=>({maHS:"HS00"+h,bai:b,hoanThanh:"Có",diemKiemTra:d,capNhat:new Date(Date.UTC(2026,9,20+(k%7),2+k)).toISOString()})),
sanPham:[{maHS:"HS001",bai:1,loai:"cau-hoi",noiDung:"Giải pháp trích xuất đúng bao nhiêu phần trăm câu hỏi, kể cả hình ảnh, từ 30 đề Word môn Toán, Vật lí và Sinh học?\nTự đánh giá: đạt 5/5 tiêu chí",capNhat:"2026-10-21T03:00:00Z"},{maHS:"HS003",bai:3,loai:"gia-thuyet",noiDung:"Nếu giáo viên dùng giải pháp tự động để đưa đề lên hệ thống thì thời gian giảm ít nhất 70% so với nhập thủ công vì hệ thống tự tách câu, phương án, đáp án và hình ảnh.",capNhat:"2026-10-23T08:00:00Z"},{maHS:"HS003",bai:4,loai:"ke-hoach",noiDung:"KẾ HOẠCH NGHIÊN CỨU\nCâu hỏi: Giải pháp trích xuất đúng bao nhiêu phần trăm câu hỏi từ đề Word THPT?\nPhương pháp: Thiết kế, chế tạo và thử nghiệm\nCỡ mẫu: 30",capNhat:"2026-10-25T08:00:00Z"}]};
function teacherHTML(){
  if(ONLINE&&!GV)return `<span class="phase">Giáo viên</span><h1>Quản lý học sinh</h1>
<p class="lead">Nhập mã giáo viên (đặt trong file Code.gs) để xem tiến độ và bài nộp của học sinh.</p>
<form class="login" id="gvForm"><label class="f" for="gvMa">Mã giáo viên<input type="password" id="gvMa" value="${esc(gvKey)}"></label>
<button class="btn" id="gvBtn" type="submit">Xem tiến độ học sinh</button><p class="msg" id="gvMsg" role="alert"></p></form>`;
  const d=GV||SAMPLE,lops=[...new Set(d.hocSinh.map(h=>h.lop))].sort();
  return `<span class="phase">Giáo viên</span><h1>Quản lý học sinh</h1>
${ONLINE?"":`<p class="notice"><b>Đây là dữ liệu mẫu.</b> Website chưa kết nối Google Sheets. Sau khi cài đặt theo hướng dẫn, trang này sẽ hiện học sinh thật của thầy cô.</p>`}
<div class="stats" id="gvStats"></div>
<div class="filters"><label class="f" for="gvLop">Lớp<select id="gvLop"><option value="">Tất cả các lớp</option>${lops.map(l=>`<option>${esc(l)}</option>`).join("")}</select></label>
<label class="f" for="gvTim">Tìm học sinh<input type="text" id="gvTim" placeholder="Nhập tên hoặc mã"></label>
${ONLINE?'<button class="btn ghost" id="gvReload">Tải lại</button>':""}</div>
<div class="tbl tt"><table id="gvTbl"></table></div>
<p class="muted" style="font-size:14px">Bấm vào một dòng để xem bài nộp của học sinh đó. Dữ liệu gốc nằm trong Google Sheets: thêm, sửa hoặc xóa học sinh ở trang tính HocSinh.</p>`;
}
function gvRows(){
  const d=GV||SAMPLE,k=x=>String(x).trim().toUpperCase();
  return d.hocSinh.map(h=>{
    const td=d.tienDo.filter(r=>k(r.maHS)===k(h.maHS)),sp=d.sanPham.filter(r=>k(r.maHS)===k(h.maHS));
    const done=new Set(td.filter(r=>r.hoanThanh==="Có").map(r=>Number(r.bai)));
    let dung=0,tong=0;td.forEach(r=>{const m=String(r.diemKiemTra||"").match(/(\d+)\s*\/\s*(\d+)/);if(m){dung+=+m[1];tong+=+m[2]}});
    const t=[...td,...sp].map(r=>r.capNhat).filter(Boolean).sort();
    return Object.assign({},h,{done,dung,tong,sp,last:t[t.length-1]||""});
  });
}
function renderGV(){
  const lop=$("gvLop").value,q=$("gvTim").value.trim().toLowerCase();
  const rows=gvRows().filter(r=>(!lop||r.lop===lop)&&(!q||String(r.hoTen).toLowerCase().includes(q)||String(r.maHS).toLowerCase().includes(q)));
  const n=rows.length,avg=n?rows.reduce((a,r)=>a+r.done.size,0)/n:0,nsp=rows.reduce((a,r)=>a+r.sp.length,0);
  $("gvStats").innerHTML=`<div class="stat"><b>${n}</b><span>học sinh${lop?" lớp "+esc(lop):""}</span></div><div class="stat"><b>${avg.toLocaleString("vi-VN",{maximumFractionDigits:1})}/8</b><span>số bài hoàn thành trung bình</span></div><div class="stat"><b>${nsp}</b><span>sản phẩm đã nộp</span></div>`;
  $("gvTbl").innerHTML=`<tr><th>Mã HS</th><th>Họ tên</th><th>Lớp</th><th>Tiến độ 8 bài</th><th>Điểm kiểm tra</th><th>Bài nộp</th><th>Cập nhật gần nhất</th></tr>`+
   (n?rows.map((r,ix)=>`<tr class="hs" data-ix="${ix}" tabindex="0"><td>${esc(r.maHS)}</td><td>${esc(r.hoTen)}</td><td>${esc(r.lop)}</td>
   <td><span class="strip">${L.map((l,i)=>`<i class="p${ph(i)}${r.done.has(i+1)?" on":""}" title="Bài ${i+1}"></i>`).join("")}</span> ${r.done.size}/8</td>
   <td>${r.tong?`${r.dung}/${r.tong}`:"—"}</td><td>${r.sp.length}</td><td>${r.last?fmt(r.last):'<span class="muted">Chưa hoạt động</span>'}</td></tr>`).join("")
   :`<tr><td colspan="7" class="muted">Không có học sinh phù hợp.</td></tr>`);
  $("gvTbl").querySelectorAll("tr.hs").forEach(tr=>{const open=()=>{
    const nx=tr.nextElementSibling;if(nx&&nx.classList.contains("detail")){nx.remove();return}
    const r=rows[+tr.dataset.ix];const det=document.createElement("tr");det.className="detail";
    det.innerHTML=`<td colspan="7"><div class="sp">${r.sp.length?r.sp.sort((a,b)=>a.bai-b.bai).map(s=>`<div><small>Bài ${esc(s.bai)} · ${esc(LOAI[s.loai]||s.loai)} · ${fmt(s.capNhat)}</small>${esc(s.noiDung)}</div>`).join(""):'<span class="muted">Học sinh chưa nộp sản phẩm nào.</span>'}</div></td>`;
    tr.after(det)};tr.onclick=open;tr.onkeydown=e=>{if(e.key==="Enter")open()}});
}
async function loadGV(key,msgEl,btn){
  if(btn)btn.disabled=true;if(msgEl){msgEl.style.color="var(--muted)";msgEl.textContent="Đang tải dữ liệu…"}
  try{GV=await api({action:"giaoVien",maGV:key});gvKey=key;try{sessionStorage.setItem("nckh-gv",key)}catch(e){}route()}
  catch(e){if(msgEl){msgEl.style.color="";msgEl.textContent=e.message}else if($("gvStats"))$("gvStats").insertAdjacentHTML("beforebegin",`<p class="notice">${esc(e.message)}</p>`)}
  if(btn)btn.disabled=false;
}
function initTeacher(){
  if(ONLINE&&!GV){$("gvForm").onsubmit=e=>{e.preventDefault();const k=$("gvMa").value.trim();if(!k){$("gvMsg").textContent="Hãy nhập mã giáo viên.";return}loadGV(k,$("gvMsg"),$("gvBtn"))};return}
  $("gvLop").onchange=renderGV;$("gvTim").oninput=renderGV;
  if($("gvReload"))$("gvReload").onclick=()=>loadGV(gvKey,null,$("gvReload"));
  renderGV();
}

/* ---------- điều hướng ---------- */
function userBox(){
  if(!ONLINE)return `<div class="user"><span class="muted">Tiến độ đang lưu trên máy này.</span></div>`;
  if(!U)return "";
  if(U.guest)return `<div class="user"><b>Đang học không đăng nhập</b><span class="muted">Tiến độ chỉ lưu trên máy này.</span><div class="r"><button class="linkbtn" data-act="logout">Đăng nhập</button></div></div>`;
  return `<div class="user"><b>${esc(U.hoTen)}</b><div class="r"><span>${esc(U.maHS)} · Lớp ${esc(U.lop)}</span><button class="linkbtn" data-act="logout">Đăng xuất</button></div><span class="sync" id="SYNCID">${S.queue.length?"Còn "+S.queue.length+" thay đổi chưa lưu lên hệ thống":"Đã lưu lên hệ thống"}</span></div>`;
}
function nav(cur){
  let h=`<a href="#trang-chu" class="p0${cur===-1?" on":""}"><span class="n">⌂</span><span>Trang chủ</span><span></span></a>`;
  L.forEach((l,i)=>{if(i===0||ph(i)!==ph(i-1))h+=`<div class="grp p${ph(i)}">${PH[ph(i)].k}</div>`;
    h+=`<a href="#${l.id}" class="p${ph(i)}${cur===i?" on":""}"><span class="n">${i+1}</span><span>${l.t}</span><span class="tick${S.done[l.id]?" done":""}"></span></a>`});
  h+=`<div class="grp p2">Giáo viên</div><a href="#giao-vien" class="p2${cur===-2?" on":""}"><span class="n">GV</span><span>Quản lý học sinh</span><span></span></a>`;
  $("toc").innerHTML=h;
  $("mobsel").innerHTML=`<option value="trang-chu">Trang chủ</option>`+L.map((l,i)=>`<option value="${l.id}"${cur===i?" selected":""}>Bài ${i+1}. ${l.t}${S.done[l.id]?" ✓":""}</option>`).join("")+`<option value="giao-vien"${cur===-2?" selected":""}>Giáo viên: Quản lý học sinh</option>`;
  const ub=userBox();$("user").innerHTML=ub.replace("SYNCID","sync");$("userm").innerHTML=ub.replace("SYNCID","syncm");
  document.querySelectorAll('[data-act="logout"]').forEach(b=>b.onclick=logout);
  const n=L.filter(l=>S.done[l.id]).length;$("progText").textContent=`Đã hoàn thành ${n}/8 bài`;
  $("progBar").innerHTML=L.map((l,i)=>`<span class="p${ph(i)}" style="width:12.5%;background:${S.done[l.id]?"var(--ph)":"transparent"}"></span>`).join("");
}
function route(){
  if(typeof MON!=="undefined"&&MON.on){MON.on=false;try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}}
  const h=location.hash.slice(1),i=L.findIndex(l=>l.id===h),page=$("page");
  if(h==="giao-vien"){page.className="page p0";page.innerHTML=teacherHTML();nav(-2);initTeacher()}
  else if(ONLINE&&!U){page.className="page p0";page.innerHTML=loginHTML();nav(-1);initLogin()}
  else if(i<0){page.className="page p0";page.innerHTML=home();nav(-1)}
  else{page.className="page p"+ph(i);page.innerHTML=lesson(i);nav(i);initLesson(i)}
  window.scrollTo(0,0);flush();
}
$("mobsel").onchange=e=>{location.hash=e.target.value};
window.addEventListener("hashchange",route);
route();
</script>
